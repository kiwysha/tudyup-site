<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TidyUp — скачать</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9f1ee;
    --ink: #10231f;
    --muted: #4d6660;
    --card: #ffffff;
    --accent: #0f6b5c;
    --accent-ink: #ffffff;
    --line: #c5d6d0;
    --error: #b3261e;
    --ok: #0f6b5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1a17;
      --ink: #e6f2ee;
      --muted: #8fb0a7;
      --card: #14282340;
      --accent: #46c2a8;
      --accent-ink: #06201a;
      --line: #25423b;
      --error: #ff8a80;
      --ok: #46c2a8;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Onest", system-ui, sans-serif;
    line-height: 1.55;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    min-height: 100vh;
  }
  main { width: 100%; max-width: 440px; }
  h1 {
    font-family: "Unbounded", "Onest", sans-serif;
    font-weight: 600;
    font-size: clamp(2rem, 8vw, 2.75rem);
    line-height: 1.1;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  p.lead { margin: 0 0 28px; color: var(--muted); max-width: 38ch; }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input {
    width: 100%;
    font: inherit;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--ink);
    text-transform: uppercase;
  }
  input::placeholder { color: var(--muted); opacity: .6; }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  button {
    margin-top: 14px;
    width: 100%;
    font: inherit;
    font-weight: 600;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  #msg { min-height: 1.6em; margin: 14px 0 0; font-size: .95rem; }
  #msg.error { color: var(--error); }
  #msg.ok { color: var(--ok); }
  footer { margin-top: 20px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>TidyUp</h1>
  <p class="lead"The best cleaner.</p>

  <form id="form" autocomplete="off">
    <label for="key">Ключ доступа</label>
    <input id="key" name="key" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="40" required spellcheck="false">
    <button id="btn" type="submit">Скачать</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>

  <footer>Нет ключа? Напиши мне: <a href="https://t.me/kiw6sha_bot" style="color:inherit">@kiw6sha_bot</a></footer>
</main>

<script>
  // Адрес твоего Worker после деплоя (без слэша на конце)
  const WORKER_URL = "https://tidyup-license.newgeqq.workers.dev";

  const form = document.getElementById("form");
  const input = document.getElementById("key");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  function show(text, type) {
    msg.textContent = text;
    msg.className = type || "";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    show("Проверяю ключ…");
    try {
      const res = await fetch(WORKER_URL + "/check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: input.value }),
      });
      const data = await res.json();
      if (!res.ok) {
        show(data.error || "Не удалось проверить ключ", "error");
      } else {
        show("Ключ принят. Скачивание начнётся сейчас.", "ok");
        window.location.href = data.url;
      }
    } catch {
      show("Нет связи с сервером. Попробуй ещё раз позже.", "error");
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
