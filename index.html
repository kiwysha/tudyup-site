<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TidyUP Admin</title>
<style>
  :root { --bg:#0d1a17; --ink:#e6f2ee; --muted:#8fb0a7; --accent:#46c2a8; --line:#25423b; --err:#ff8a80; --ok:#46c2a8; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; }
  h1 { margin:0 0 16px; font-weight:600; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  button, input { font:inherit; padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); }
  button { background:var(--accent); color:#06201a; border:0; cursor:pointer; font-weight:600; }
  button.sec { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.danger { background:#3a1a1a; color:var(--err); border:0; }
  button:hover { opacity:.9; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); font-size:.92rem; }
  th { color:var(--muted); font-weight:500; }
  code { background:#0a1512; padding:2px 6px; border-radius:4px; font-size:.85em; }
  .msg { margin:10px 0; color:var(--muted); }
  .msg.err { color:var(--err); }
  .msg.ok { color:var(--ok); }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.78rem; }
  .pill.on { background:#0f6b5c; color:#e6f2ee; }
  .pill.off { background:#3a1a1a; color:var(--err); }
  .pill.free { background:#1f3a5c; color:#b8d4ff; }
  td.actions button { margin-right:4px; padding:6px 10px; font-size:.82rem; }
</style>
</head>
<body>
<h1>TidyUP Admin</h1>

<div class="bar">
  <input id="secret" type="password" placeholder="admin secret" style="min-width:280px">
  <button onclick="saveSecret()">Сохранить секрет</button>
  <button class="sec" onclick="reload()">Обновить</button>
  <button onclick="generateKeys(5)">+ 5 ключей</button>
  <button onclick="generateKeys(20)">+ 20 ключей</button>
</div>

<div id="msg" class="msg"></div>

<table id="tbl">
  <thead>
    <tr><th>Ключ</th><th>HWID</th><th>Статус</th><th>Активирован</th><th></th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
// ЗАМЕНИ НА СВОЙ WORKER
const WORKER = "https://tidyup-license.newgeqq.workers.dev";

function getSecret() {
  return sessionStorage.getItem("adm") || "";
}
function saveSecret() {
  sessionStorage.setItem("adm", document.getElementById("secret").value.trim());
  reload();
}
function show(text, type) {
  const m = document.getElementById("msg");
  m.textContent = text;
  m.className = "msg " + (type || "");
}

async function api(path, method = "GET", body = null) {
  const headers = { "X-Admin-Secret": getSecret() };
  if (body) headers["Content-Type"] = "application/json";
  const res = await fetch(WORKER + path, {
    method, headers, body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Ошибка");
  return data;
}

async function reload() {
  if (!getSecret()) { show("Введи admin secret и нажми Сохранить", "err"); return; }
  try {
    const data = await api("/admin/list");
    render(data.keys);
    show(`Ключей: ${data.keys.length}, HWID-привязок: ${data.hwidCount}`, "ok");
  } catch (e) {
    show(e.message, "err");
  }
}

function render(keys) {
  const tbody = document.querySelector("#tbl tbody");
  tbody.innerHTML = "";
  for (const k of keys) {
    const tr = document.createElement("tr");
    let status = '<span class="pill free">не активирован</span>';
    if (k.disabled) status = '<span class="pill off">отключён</span>';
    else if (k.hwid) status = '<span class="pill on">активен</span>';

    tr.innerHTML = `
      <td><code>${k.key}</code></td>
      <td>${k.hwid ? `<code>${k.hwid.slice(0, 16)}…</code>` : "—"}</td>
      <td>${status}</td>
      <td>${k.activatedAt ? new Date(k.activatedAt).toLocaleString() : "—"}</td>
      <td class="actions"></td>
    `;
    const actions = tr.querySelector(".actions");

    if (k.hwid) {
      const b = document.createElement("button");
      b.className = "sec"; b.textContent = "Unbind";
      b.onclick = async () => {
        if (!confirm(`Отвязать HWID от ${k.key}?`)) return;
        try { await api("/unbind", "POST", { key: k.key }); reload(); }
        catch (e) { show(e.message, "err"); }
      };
      actions.appendChild(b);
    }

    if (!k.disabled) {
      const b = document.createElement("button");
      b.className = "sec"; b.textContent = "Disable";
      b.onclick = async () => {
        if (!confirm(`Отключить ${k.key}?`)) return;
        try { await api("/disable", "POST", { key: k.key }); reload(); }
        catch (e) { show(e.message, "err"); }
      };
      actions.appendChild(b);
    }

    const bd = document.createElement("button");
    bd.className = "danger"; bd.textContent = "Delete";
    bd.onclick = async () => {
      if (!confirm(`Удалить ${k.key}? Это необратимо.`)) return;
      try { await api("/admin/delete", "POST", { key: k.key }); reload(); }
      catch (e) { show(e.message, "err"); }
    };
    actions.appendChild(bd);

    tbody.appendChild(tr);
  }
}

async function generateKeys(n) {
  if (!getSecret()) { show("Сначала введи admin secret", "err"); return; }
  try {
    const data = await api("/admin/generate", "POST", { count: n });
    show("Создано: " + data.keys.join(", "), "ok");
    reload();
  } catch (e) { show(e.message, "err"); }
}

if (getSecret()) reload();
</script>
</body>
</html>
