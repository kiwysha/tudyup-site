<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TidyUP — скачать</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9f1ee;
    --ink: #10231f;
    --muted: #4d6660;
    --card: #ffffff;
    --accent: #0f6b5c;
    --accent-rgb: 15, 107, 92;
    --accent-ink: #ffffff;
    --line: #c5d6d0;
    --error: #b3261e;
    --ok: #0f6b5c;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #0d1a17; --ink: #e6f2ee; --muted: #8fb0a7; --card: #14282360;
      --accent: #46c2a8; --accent-rgb: 70, 194, 168; --accent-ink: #06201a;
      --line: #25423b; --error: #ff8a80; --ok: #46c2a8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1a17; --ink: #e6f2ee; --muted: #8fb0a7; --card: #14282360;
    --accent: #46c2a8; --accent-rgb: 70, 194, 168; --accent-ink: #06201a;
    --line: #25423b; --error: #ff8a80; --ok: #46c2a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Onest", system-ui, sans-serif;
    line-height: 1.55;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    position: relative;
    overflow: hidden;
  }

  /* курсор-свечение */
  #glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(
      420px circle at var(--mx, 50%) var(--my, 50%),
      rgba(var(--accent-rgb), 0.16),
      transparent 70%
    );
    transition: opacity .3s ease;
    opacity: 0;
  }
  #glow.active { opacity: 1; }

  main { position: relative; z-index: 1; width: 100%; max-width: 420px; }

  .mark { font-family: var(--mono); font-size: .78rem; color: var(--muted); margin-bottom: 8px; }
  h1 {
    font-family: "Unbounded", "Onest", sans-serif;
    font-weight: 600;
    font-size: clamp(2rem, 8vw, 2.75rem);
    line-height: 1.1;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  p.lead { margin: 0 0 28px; color: var(--muted); max-width: 38ch; }

  form {
    background: var(--card);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  form:focus-within {
    border-color: rgba(var(--accent-rgb), .5);
    box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .08);
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input {
    width: 100%;
    font: inherit;
    font-family: var(--mono);
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--ink);
    text-transform: uppercase;
    transition: border-color .2s ease;
  }
  input::placeholder { color: var(--muted); opacity: .6; }
  input:hover { border-color: rgba(var(--accent-rgb), .55); }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  button {
    margin-top: 14px;
    width: 100%;
    font: inherit;
    font-weight: 600;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    transition: background-color .2s ease, transform .15s ease, box-shadow .2s ease;
  }
  button:hover:not(:disabled) {
    background-color: color-mix(in srgb, var(--accent) 84%, white 16%);
    box-shadow: 0 6px 18px -6px rgba(var(--accent-rgb), .55);
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .6; cursor: progress; }

  #msg { min-height: 1.6em; margin: 14px 0 0; font-size: .95rem; }
  #msg.error { color: var(--error); }
  #msg.ok { color: var(--ok); }
  footer { position: relative; z-index: 1; margin-top: 20px; font-size: .85rem; color: var(--muted); }
  footer a { color: inherit; }

  @media (hover: none) { #glow { display: none; } }
</style>
</head>
<body>
<div id="glow"></div>

<main>
  <div class="mark">tidyup · v1.0</div>
  <h1>TidyUP</h1>

  <form id="form" autocomplete="off">
    <label for="key">Ключ доступа</label>
    <input id="key" name="key" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="40" required spellcheck="false">
    <button id="btn" type="submit">Скачать</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>

  <footer>Нет ключа? Напиши мне: <a href="https://t.me/ТВОЙ_НИК">@ТВОЙ_НИК</a></footer>
</main>

<script>
  // Адрес твоего Worker после деплоя (без слэша на конце)
  const WORKER_URL = "https://tidyup-license.newgeqq.workers.dev";

  // курсор-свечение
  const glow = document.getElementById("glow");
  let raf = null;
  window.addEventListener("pointermove", (e) => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      glow.style.setProperty("--mx", e.clientX + "px");
      glow.style.setProperty("--my", e.clientY + "px");
      glow.classList.add("active");
      raf = null;
    });
  });
  window.addEventListener("pointerleave", () => glow.classList.remove("active"));

  const form = document.getElementById("form");
  const input = document.getElementById("key");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  function show(text, type) {
    msg.textContent = text;
    msg.className = type || "";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    show("Проверяю ключ…");
    try {
      const res = await fetch(WORKER_URL + "/check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: input.value }),
      });
      const data = await res.json();
      if (!res.ok) {
        show(data.error || "Не удалось проверить ключ", "error");
      } else {
        show("Ключ принят. Скачивание начнётся сейчас.", "ok");
        window.location.href = data.url;
      }
    } catch {
      show("Нет связи с сервером. Попробуй ещё раз позже.", "error");
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
